<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Demo Payment App</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#8b18d8,#f4c9ff);
  color:#35105f;
}

button,input{
  font:inherit;
}

.screen{
  display:none;
  min-height:100vh;
  padding:18px;
}

.screen.active{
  display:block;
}

.demo-tag{
  display:inline-block;
  background:#fff0a8;
  color:#542000;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:12px;
}

/* ---------------- HOME ---------------- */

#home{
  text-align:center;
  padding-top:35px;
}

#home h1{
  color:white;
  font-size:42px;
  margin:20px 0 5px;
  text-shadow:0 3px 8px #6b159b;
}

.subtitle{
  color:#572477;
  font-size:20px;
  margin-bottom:45px;
}

.cards{
  display:flex;
  gap:22px;
  justify-content:center;
}

.card{
  width:48%;
  max-width:310px;
  background:white;
  border-radius:25px;
  padding:25px 14px;
  box-shadow:0 10px 25px #7618a544;
}

.card h2{
  font-size:22px;
  margin:0 0 20px;
}

.price{
  background:linear-gradient(90deg,#8a18d8,#b51ce7);
  color:white;
  font-size:32px;
  font-weight:bold;
  padding:15px 5px;
  margin:15px -5px 25px;
}

.card ul{
  text-align:left;
  padding-left:22px;
  line-height:2;
  font-size:15px;
}

.btn{
  border:0;
  border-radius:30px;
  padding:15px 25px;
  background:#8c20dc;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.big-btn{
  width:100%;
  margin-top:15px;
  font-size:18px;
}

.bottom-buttons{
  display:flex;
  gap:22px;
  margin-top:60px;
}

.bottom-buttons button{
  flex:1;
  min-height:90px;
}

/* ---------------- PAYMENT CODE ---------------- */

.panel{
  max-width:760px;
  margin:auto;
  background:#fff8ff;
  border-radius:28px;
  padding:24px;
  box-shadow:0 12px 35px #54126c55;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.back{
  background:none;
  border:0;
  color:#572477;
  font-size:22px;
  cursor:pointer;
}

.amount{
  text-align:right;
}

.amount small{
  display:block;
  font-size:15px;
}

.amount strong{
  font-size:38px;
}

.payment-title{
  font-size:32px;
  font-weight:bold;
  margin:15px 0;
}

.order{
  font-size:18px;
  margin:20px 0;
}

.qr{
  width:260px;
  height:260px;
  margin:20px auto;
  background:
    repeating-linear-gradient(
      45deg,#111 0 5px,#fff 5px 10px
    );
  border:20px solid white;
  outline:2px solid #ccc;
}

.fake-note{
  text-align:center;
  color:#777;
  font-size:13px;
}

.code-box{
  border:2px solid #d3b9df;
  border-radius:18px;
  padding:18px;
  margin-top:25px;
}

.code-box h3{
  margin:0 0 6px;
}

.code-row{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.code-row input{
  flex:1;
  min-width:0;
  padding:15px;
  border:2px solid #cdb6d6;
  border-radius:12px;
}

.code-row button{
  border:0;
  background:#6820d8;
  color:white;
  padding:0 22px;
  border-radius:12px;
  font-weight:bold;
}

/* ---------------- DEMO APP ---------------- */

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  color:#222;
  border-radius:28px;
  overflow:hidden;
  position:relative;
}

.app-header{
  background:linear-gradient(135deg,#5520e5,#8d19d7);
  color:white;
  padding:25px 20px 30px;
}

.app-header h2{
  margin:10px 0;
}

.balance{
  font-size:34px;
  font-weight:bold;
}

.demo-warning{
  background:#fff0a8;
  color:#542000;
  text-align:center;
  padding:7px;
  font-size:12px;
  font-weight:bold;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:18px 12px;
}

.action{
  border:0;
  background:white;
  padding:10px 3px;
  border-radius:15px;
  box-shadow:0 2px 10px #00000014;
  cursor:pointer;
}

.icon{
  width:50px;
  height:50px;
  margin:auto;
  border-radius:50%;
  background:#7620dc;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  margin-bottom:7px;
}

.section{
  padding:15px;
}

.section h3{
  margin-top:5px;
}

.tile{
  background:#f6effa;
  padding:18px;
  border-radius:18px;
  margin-bottom:12px;
}

/* ---------------- SEND MONEY ---------------- */

.form-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:25px;
}

.label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

.input{
  width:100%;
  padding:16px;
  border:2px solid #cdbbd5;
  border-radius:13px;
  outline:none;
}

.amount-input{
  font-size:28px;
}

.primary{
  width:100%;
  border:0;
  border-radius:15px;
  background:#7020df;
  color:white;
  padding:17px;
  font-weight:bold;
  margin-top:25px;
}

/* ---------------- BANK ---------------- */

.bank{
  border:2px solid #e0d1e7;
  padding:18px;
  border-radius:18px;
  margin:12px 0;
  cursor:pointer;
}

.bank.selected{
  border-color:#7620dc;
  background:#f4eaff;
}

.bank-name{
  font-size:19px;
  font-weight:bold;
}

.bank-detail{
  color:#777;
  margin-top:5px;
}

/* ---------------- PIN ---------------- */

.pin-screen{
  text-align:center;
}

.pin-dots{
  font-size:30px;
  letter-spacing:10px;
  margin:30px 0;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:330px;
  margin:30px auto;
}

.key{
  height:65px;
  border:0;
  border-radius:18px;
  background:#f1e9f5;
  font-size:23px;
}

.pay-key{
  background:#7020df;
  color:white;
}

/* ---------------- LOADING ---------------- */

.loading{
  min-height:80vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.loader{
  width:90px;
  height:50px;
  border-radius:40px;
  background:#7020df;
  position:relative;
  overflow:hidden;
  margin-bottom:30px;
}

.loader:after{
  content:"";
  position:absolute;
  width:45px;
  height:45px;
  left:2px;
  top:2px;
  border-radius:50%;
  background:#c65ae8;
  animation:move 1s infinite alternate;
}

@keyframes move{
  to{left:43px}
}

/* ---------------- SUCCESS ---------------- */

.success{
  text-align:center;
}

.success-icon{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#22c55e;
  color:white;
  font-size:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:25px auto;
}

.success h1{
  color:#159447;
}

.receipt{
  background:white;
  border-radius:20px;
  padding:20px;
